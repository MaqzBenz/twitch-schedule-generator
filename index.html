<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Scheduler Pro</title>
    <link rel="stylesheet" href="style.css">
    <!-- Chargement des Polices -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700;900&family=Montserrat:wght@400;700;900&family=Oswald:wght@400;700&family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        
        <aside class="sidebar">
            <header class="sidebar-header">
                <h1>Scheduler <span>PRO</span></h1>
            </header>

            <section class="control-group">
                <h3>1. Données du Planning</h3>
                <input type="text" id="twitchUsername" class="input-text" placeholder="Pseudo Twitch">
                <button id="btnFetchTwitch" class="btn btn-twitch">1. Connexion Twitch</button>
                <button id="btnOpenEditor" class="btn btn-primary" style="margin-top: 10px;">2. ✏️ Éditeur Manuel</button>
            </section>

            <hr class="divider">

            <section class="control-group">
                <h3>2. Design & Layout</h3>
                <label class="label-small">Style Visuel</label>
                <select id="themeStyle" class="input-text select-box">
                    <option value="classic">Classique (Cartes Verre)</option>
                    <option value="minimal">Minimaliste (Épuré)</option>
                    <option value="neon">Néon (Gaming Glow)</option>
                </select>

                <label class="label-small">Orientation</label>
                <div class="toggle-group" style="margin-bottom:10px;">
                    <button id="btnFormatLandscape" class="btn btn-toggle active">Paysage</button>
                    <button id="btnFormatPortrait" class="btn btn-toggle">Portrait</button>
                </div>

                <label class="label-small">Police d'écriture</label>
                <select id="fontFamily" class="input-text select-box">
                    <option value="Inter">Inter (Moderne)</option>
                    <option value="Montserrat">Montserrat (Élégant)</option>
                    <option value="Poppins">Poppins (Rond)</option>
                    <option value="Bebas Neue">Bebas Neue (Impact)</option>
                    <option value="Oswald">Oswald (Condensé)</option>
                </select>
            </section>

            <hr class="divider">

            <section class="control-group">
                <h3>3. Couleurs & Fond</h3>
                <div class="color-picker-row">
                    <label>Accentuation</label>
                    <input type="color" id="colorAccent" value="#9146FF">
                </div>
                <div class="color-picker-row">
                    <label>Texte</label>
                    <input type="color" id="colorText" value="#ffffff">
                </div>
                <div class="bg-upload-row">
                    <input type="file" id="bgUploader" accept="image/png, image/jpeg, image/webp" style="display: none;">
                    <button id="btnUploadBg" class="btn btn-secondary" onclick="document.getElementById('bgUploader').click()">🖼️ Fond d'écran</button>
                    <button id="btnClearBg" class="btn btn-danger-icon" title="Enlever le fond">✖</button>
                </div>
            </section>

            <hr class="divider">

            <section class="control-group">
                <h3>4. Sauvegarde Projet</h3>
                <div class="split-buttons">
                    <button id="btnExportConfig" class="btn btn-secondary">💾 Exporter</button>
                    <input type="file" id="importConfig" accept=".json" style="display: none;">
                    <button id="btnImportConfig" class="btn btn-secondary" onclick="document.getElementById('importConfig').click()">📂 Importer</button>
                </div>
            </section>
        </aside>

        <main class="preview-area">
            <div class="canvas-wrapper">
                <canvas id="scheduleCanvas" width="1920" height="1080"></canvas>
            </div>
            <div class="action-bar">
                <button id="btnDownloadImage" class="btn btn-success">📥 Télécharger l'image HD</button>
            </div>
        </main>
    </div>

    <!-- GRAND MODAL: ÉDITEUR DE SEMAINE MANUEL -->
    <div id="weekEditorModal" class="modal hidden">
        <div class="modal-content large-modal">
            <h2>Éditeur de Semaine</h2>
            <p class="hint" style="margin-bottom: 20px;">Modifiez votre semaine manuellement. Pour chercher une jaquette, assurez-vous d'avoir cliqué sur "Connexion Twitch" d'abord.</p>
            
            <div id="daysList" class="days-list">
                <!-- Les 7 jours seront générés ici en JavaScript -->
            </div>

            <div class="modal-actions">
                <button id="btnSaveWeek" class="btn btn-success">Sauvegarder et Appliquer</button>
                <button id="btnCloseWeek" class="btn btn-secondary">Annuler</button>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
