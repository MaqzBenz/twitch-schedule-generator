<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Scheduler Pro v4</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Préchargement des polices pour éviter les clignotements -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700;900&family=Montserrat:wght@400;700;900&family=Oswald:wght@400;700&family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- FontAwesome pour les logos des réseaux sociaux -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        
        <aside class="sidebar">
            <header class="sidebar-header">
                <h1>Scheduler <span>V4</span></h1>
            </header>

            <section class="control-group">
                <h3>1. Source des données</h3>
                <input type="text" id="twitchUsername" class="input-text" placeholder="Pseudo Principal (ex: Ninja)">
                
                <button id="btnFetchTwitch" class="btn btn-twitch" style="margin-bottom: 8px;">
                    <i class="fab fa-twitch"></i> Synchro Twitch API
                </button>
                <button id="btnOpenEditor" class="btn btn-primary">
                    <i class="fas fa-edit"></i> Éditeur Manuel (Multi-Lives)
                </button>
            </section>

            <hr class="divider">

            <!-- NOUVEAU : GESTION DYNAMIQUE DES RÉSEAUX SOCIAUX -->
            <section class="control-group">
                <h3>2. Réseaux Sociaux</h3>
                <div id="socialsContainer">
                    <!-- Les réseaux seront injectés ici -->
                </div>
                <button id="btnAddSocial" class="btn btn-secondary btn-small" style="margin-top: 10px;">+ Ajouter un réseau</button>
            </section>

            <hr class="divider">

            <section class="control-group">
                <h3>3. Apparence & Styles</h3>
                <label class="label-small">Style Visuel</label>
                <select id="themeStyle" class="input-text select-box">
                    <option value="classic">Classique (Cartes Verre)</option>
                    <option value="minimal">Minimaliste (Lignes pures)</option>
                    <option value="neon">Néon (Gaming Glow)</option>
                    <option value="polaroid">Polaroid (Photos & Scotch)</option> <!-- NOUVEAU STYLE -->
                </select>

                <label class="label-small">Orientation</label>
                <div class="toggle-group" style="margin-bottom:10px;">
                    <button id="btnFormatLandscape" class="btn btn-toggle active">Paysage</button>
                    <button id="btnFormatPortrait" class="btn btn-toggle">Portrait</button>
                </div>

                <label class="label-small">Police d'écriture</label>
                <select id="fontFamily" class="input-text select-box">
                    <option value="Inter">Inter (Moderne)</option>
                    <option value="Montserrat">Montserrat (Élégant)</option>
                    <option value="Poppins">Poppins (Rond)</option>
                    <option value="Bebas Neue">Bebas Neue (Impact)</option>
                    <option value="Oswald">Oswald (Condensé)</option>
                </select>
            </section>

            <hr class="divider">

            <section class="control-group">
                <h3>4. Couleurs & Image</h3>
                <div class="color-picker-row">
                    <label>Couleur dominante</label>
                    <input type="color" id="colorAccent" value="#9146FF">
                </div>
                <div class="color-picker-row">
                    <label>Couleur du texte</label>
                    <input type="color" id="colorText" value="#ffffff">
                </div>
                <div class="bg-upload-row">
                    <input type="file" id="bgUploader" accept="image/png, image/jpeg, image/webp" style="display: none;">
                    <button id="btnUploadBg" class="btn btn-secondary" onclick="document.getElementById('bgUploader').click()">
                        <i class="fas fa-image"></i> Ajouter un fond
                    </button>
                    <button id="btnClearBg" class="btn btn-danger-icon" title="Enlever le fond"><i class="fas fa-trash"></i></button>
                </div>
            </section>

            <hr class="divider">

            <section class="control-group">
                <h3>5. Projets</h3>
                <div class="split-buttons">
                    <button id="btnExportConfig" class="btn btn-secondary">Sauvegarder</button>
                    <input type="file" id="importConfig" accept=".json" style="display: none;">
                    <button id="btnImportConfig" class="btn btn-secondary" onclick="document.getElementById('importConfig').click()">Charger</button>
                </div>
            </section>
        </aside>

        <main class="preview-area">
            <div class="canvas-wrapper">
                <canvas id="scheduleCanvas" width="1920" height="1080"></canvas>
            </div>
            <div class="action-bar">
                <button id="btnDownloadImage" class="btn btn-success"><i class="fas fa-download"></i> Télécharger en HD (PNG)</button>
            </div>
        </main>
    </div>

    <!-- GRAND MODAL ÉDITEUR MULTI-LIVES (Heures de début/fin natives) -->
    <div id="weekEditorModal" class="modal hidden">
        <div class="modal-content large-modal">
            <h2>Éditeur de Semaine (Multi-Lives)</h2>
            <p class="hint" style="margin-bottom: 20px;">
                L'heure de fin est <b>optionnelle</b>. Si vous ne la remplissez pas, seule l'heure de début s'affichera.
            </p>
            
            <div id="daysList" class="days-list">
                <!-- Les jours seront injectés ici en JS -->
            </div>

            <div class="modal-actions">
                <button id="btnSaveWeek" class="btn btn-success">Appliquer au Planning</button>
                <button id="btnCloseWeek" class="btn btn-secondary">Fermer sans sauvegarder</button>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
